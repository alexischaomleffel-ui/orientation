  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"4f7c03fa-d675-46bc-ac7f-4996cf2f9e62\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"abb9d8af-c643-4ef8-b572-a275a6cffa70\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   DATATOMIC — COLORS\n   Base palette + semantic aliases. All values from brand guide.\n   ============================================================ */\n:root {\n  /* ---- Brand primary ---- */\n  --blue-500: #2D4BF0;   /* primary — CTA, filled buttons, active links */\n  --blue-700: #001d6c;   /* primary dark — hover, H1 emphasis (== ink) */\n  --blue-300: #3765fd;   /* light blue — informative icons, category badges */\n  --blue-050: #EEF0FF;   /* active nav background, subtle fills */\n\n  /* ---- Surfaces & lines ---- */\n  --lavender-050: #f4f5ff; /* global app background (blue-lavender, very light) */\n  --white:        #FFFFFF; /* sidebar, cards, tables */\n  --border:       #E4E7FF; /* separators, input outlines, table rules */\n  --border-soft:  #F0F2FF; /* faint row dividers inside tables */\n\n  /* ---- Text ---- */\n  --ink-900: #001d6c;     /* body, labels, section titles (deep navy) */\n  --ink-400: #7B8BB2;     /* secondary text, column headers, metadata */\n\n  /* ---- Accents / status ---- */\n  --orange-500: #FF4576;  /* dynamic avatars, highlights (pink-coral) */\n  --green-500:  #3be2c0;  /* active status, success, launch icons (mint) */\n  --red-500:    #EF4444;  /* errors */\n\n  /* Fixed status-badge fills (independent of the accent palette) */\n  --badge-beta: #2D4BF0;  /* BETA pill */\n  --badge-new:  #22C55E;  /* NEW pill */\n  --badge-tuto: #F97316;  /* Tuto pill */\n\n  /* Tinted backgrounds for status pills / icon tiles (pastel) */\n  --blue-tint:   #EEF0FF;\n  --orange-tint: #FFE6EC;\n  --green-tint:  #E2FAF4;\n  --red-tint:    #FDECEC;\n  --neutral-tint:#F1F3F9;\n\n  /* ============================================================\n     SEMANTIC ALIASES\n     ============================================================ */\n  --color-primary:        var(--blue-500);\n  --color-primary-hover:  var(--blue-700);\n  --color-primary-soft:   var(--blue-050);\n\n  --surface-app:     var(--lavender-050);\n  --surface-card:    var(--white);\n  --surface-sidebar: var(--white);\n  --surface-raised:  var(--white);\n\n  --border-default:  var(--border);\n  --border-strong:   #D5D9F5;\n\n  --text-primary:    var(--ink-900);\n  --text-secondary:  var(--ink-400);\n  --text-on-primary: var(--white);\n  --text-link:       var(--blue-500);\n\n  --status-success:  var(--green-500);\n  --status-success-bg: var(--green-tint);\n  --status-warning:  var(--orange-500);\n  --status-warning-bg: var(--orange-tint);\n  --status-error:    var(--red-500);\n  --status-error-bg: var(--red-tint);\n  --status-info:     var(--blue-300);\n  --status-info-bg:  var(--blue-tint);\n  --status-neutral-bg: var(--neutral-tint);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   DATATOMIC — EFFECTS\n   Radii, borders, shadows. Shadows are light & blue-tinted only.\n   Never thick or colored shadows. Never radius > 16px on cards.\n   ============================================================ */\n:root {\n  /* ---- Radii ---- */\n  --radius-sm: 6px;\n  --radius-btn: 8px;     /* buttons, inputs */\n  --radius-input: 8px;\n  --radius-card: 14px;   /* cards 12–16 */\n  --radius-card-lg: 16px;\n  --radius-pill: 999px;  /* avatars, status badges */\n\n  /* ---- Borders ---- */\n  --border-width: 1px;\n  --border-width-strong: 1.5px; /* secondary buttons */\n  --border-line: 1px solid var(--border-default);\n\n  /* ---- Shadows (subtle, blue-tinted) ---- */\n  --shadow-none: none;\n  --shadow-card: 0 2px 8px rgba(45, 75, 240, 0.06);\n  --shadow-raised: 0 4px 16px rgba(45, 75, 240, 0.10);\n  --shadow-popover: 0 8px 28px rgba(26, 26, 46, 0.12);\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 2px var(--color-primary);\n  --focus-ring-soft: 0 0 0 3px rgba(45, 75, 240, 0.20);\n\n  /* Motion — only user feedback, no superfluous animation */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-base: 180ms; /* @kind other */\n}\n<\u002Fstyle>\n  <style>\n    *{box-sizing:border-box}\n    html,body{margin:0}\n    ::-webkit-scrollbar{height:10px;width:10px}\n    ::-webkit-scrollbar-thumb{background:#D5D9F5;border-radius:6px}\n    ::-webkit-scrollbar-track{background:transparent}\n    @keyframes omWave { 0%,100%{transform:scaleY(.32)} 50%{transform:scaleY(1)} }\n    @keyframes omPulse { 0%{box-shadow:0 0 0 0 rgba(239,68,68,.45)} 70%{box-shadow:0 0 0 18px rgba(239,68,68,0)} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0)} }\n    @keyframes omSpin { to{transform:rotate(360deg)} }\n    textarea:focus, input:focus { border-color:#2D4BF0 !important; box-shadow:0 0 0 3px rgba(45,75,240,.12); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#F0F2FF;color:#1A1A2E;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:26px 24px 64px Fdiv><\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:13px 15px;\"><div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7B8BB2;font-weight:600;\">Zone de diffusion<\u002Fdiv><div style=\"font-size:13px;color:#1A1A2E;margin-top:4px;line-height:1.45;\">{{ brief.zone }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:13px 15px;\"><div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7B8BB2;font-weight:600;\">Période<\u002Fdiv><div style=\"font-size:13px;color:#1A1A2E;margin-top:4px;line-height:1.45;\">{{ brief.periode }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FFFFFF;padding:13px 15px;\"><div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7B8BB2;font-weight:600;\">Budget média<\u002Fdiv><div style=\"font-size:13px;color:#1A1A2E;margin-top:4px;line-height:1.45;\">{{ brief.budget }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;\">\n        <div><div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7B8BB2;font-weight:600;\">Contraintes<\u002Fdiv><div style=\"font-size:13px;color:#5A6485;margin-top:4px;line-height:1.5;\">{{ brief.contraintes }}<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7B8BB2;font-weight:600;\">Indicateurs (KPI)<\u002Fdiv><div style=\"font-size:13px;color:#5A6485;margin-top:4px;line-height:1.5;\">{{ brief.kpi }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ════ 01 — LA CIBLE ════ -->\n    <div style=\"display:flex;align-items:center;gap:14px;margin:34px 0 18px;\">\n      <span style=\"font-size:13px;font-weight:700;color:#FFFFFF;background:#1A1A2E;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;flex:none;\">01<\u002Fspan>\n      <h2 sty du territoire<\u002Fdiv>\n        <div style=\"position:relative;width:100%;\">\n          <svg viewBox=\"{{ map.viewBox }}\" style=\"width:100%;height:auto;display:block;\">\n            <path d=\"{{ map.path }}\" fill=\"#2D4BF0\" fillopacity=\"0.06\" stroke=\"#9FB0E8\" strokewidth=\"1.3\" strokelinejoin=\"round\" strokelinecap=\"round\"><\u002Fpath>\n            <sc-for list=\"{{ bubbles }}\" as=\"b\" hint-placeholder-count=\"6\">\n              <circle cx=\"{{ b.cx }}\" cy=\"{{ b.cy }}\" r=\"{{ b.r }}\" fill=\"#2D4BF0\" fillopacity=\"0.16\" stroke=\"#2D4BF0\" strokewidth=\"1.5\"><\u002Fcircle>\n              <circle cx=\"{{ b.cx }}\" cy=\"{{ b.cy }}\" r=\"2.5\" fill=\"#2D4BF0\"><\u002Fcircle>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n          <sc-for list=\"{{ bubbles }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div style=\"position:absolute;left:{{ b.leftPct }}%;top:{{ b.namePct }}%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:#1A1A2E;white-space:nowrap;pointer-events:none;\">{{ b.short }}<\u002Fdiv>\n            <div style=\"position:absolute;left:{{ b.leftPct }}%;top:{{ b.valPct }}%;transform:translate(-50%,-50%);font-size:10px;font-weight:600;color:#2D4BF0;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none;\">{{ b.cibleTxt }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#7B8BB2;margin-top:8px;\">Fond : région Grand Est · taille du cercle ∝ cible estimée · positions géographiques réelles.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#FFFFFF;border:1px solid #E4E7FF;border-radius:16px;padding:22px;box-shadow:0 2px 8px rgba(45,75,240,0.06);\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px;\">\n          <span style=\"font-size:13px;font-weight:600;\">Cible par bassin<\u002Fspan>\n          <span style=\"font-size:11px;color:#7B8BB2;font-variant-numeric:tab  r * Math.sin(a1)).toFixed(2) +\n           \" A\" + r + \",\" + r + \" 0 \" + large + \" 1 \" + (cx + r * Math.cos(a2)).toFixed(2) + \",\" + (cy + r * Math.sin(a2)).toFixed(2),\n        color: d.color\n      });\n      angle += slice;\n    });\n    return arcs;\n  }\n\n  fmt(n) { return String(Math.round(n)).replace(/\\B(?=(\\d{3})+(?!\\d))/g, \"\\u202F\"); }\n\n  affBand(idx) {\n    if (idx >= 130) return { color: \"#16A34A\", bg: \"#E9FBEF\" };\n    if (idx >= 110) return { color: \"#2D4BF0\", bg: \"#EEF0FF\" };\n    if (idx >= 96)  return { color: \"#5A6485\", bg: \"#F1F3F9\" };\n    return { color: \"#C2410C\", bg: \"#FFF1E8\" };\n  }\n  quadColor(idx) {\n    if (idx >= 130) return \"#16A34A\";\n    if (idx >= 110) return \"#2D4BF0\";\n    return \"#9AA4C0\";\n  }\n\n  componentWillUnmount() { this._stopAll(); }\n\n  _stopAll() {\n    if (this._timer) { clearInterval(this._timer); this._timer = null; }\n    if (this._sim) { clearInterval(this._sim); this._sim = null; }\n    if (this._rec) { try { this._rec.onend = null; this._rec.stop(); } catch (e) {} this._rec = null; }\n    this._simStarted = false;\n  }\n\n  _tx() { return document.getElementById(\"om-bf-transcript\"); }\n\n  openBrief() {\n    this._stopAll();\n    this.setState({ modal: true, draft: Object.assign({}, this.state.brief), recording: false, elapsed: 0, transcriptLen: 0, extracting: false, extracted: false });\n  }\n  closeBrief() { this._stopAll(); this.setState({ modal: false, recording: false }); }\n\n  toggleRecord() {\n    if (this.state.recording) { this._stopRecording(); return; }\n    const tx = this._tx(); if (tx) tx.value = \"\";\n    this._simStarted = false;\n    this._t0 = Date.now();\n    if (this._timer) clearInterval(this._timer);\n    this._timer = setInterval(() => {\n      this.setState({ elapsed: Math.min(Math.floor((Date.now() - this._t0) / 1000), 600) });\n    }, 500);\n    this.setState({ recording: true, elapsed: 0, transcriptLen: 0, extracted: false });\n    this._dictate();\n  }\n\n  _dictate() {\n    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n    if (SR) {\n      try {\n        const rec = new SR(); this._rec = rec;\n        rec.lang = \"fr-FR\"; rec.continuous = true; rec.interimResults = true;\n        rec.onresult = (e) => {\n          let final = \"\";\n          for (let i = e.resultIndex; i < e.results.length; i++) { if (e.results[i].isFinal) final += e.results[i][0].transcript; }\n          if (final) { const tx = this._tx(); if (tx) { tx.value = (tx.value + \" \" + final).trim(); this.setState({ transcriptLen: tx.value.length }); } }\n        };\n        rec.onerror = () => { if (!this._simStarted && this.state.recording) this._simulate(); };\n        rec.start();\n        setTimeout(() => { if (!this._simStarted && this.state.recording && this.state.transcriptLen === 0) this._simulate(); }, 1600);\n        return;\n      } catch (e) { /* bascule simulation */ }\n    }\n    this._simulate();\n  }\n\n  _simulate() {\n    if (this._simStarted) return;\n    this._simStarted = true;\n    if (this._rec) { try { this._rec.stop(); } catch (e) {} this._rec = null; }\n    const words = this.BRIEF_SAMPLE.split(\" \");\n    let i = 0;\n    const tx = this._tx(); if (tx) tx.value = \"\";\n    if (this._sim) clearInterval(this._sim);\n    this._sim = setInterval(() => {\n      const el = this._tx();\n      if (!el) { clearInterval(this._sim); this._sim = null; return; }\n      el.value = (el.value + \" \" + words[i]).trim();\n      i++;\n      if (i % 2 === 0) this.setState({ transcriptLen: el.value.length });\n      el.scrollTop = el.scrollHeight;\n      if (i >= words.length) { clearInterval(this._sim); this._sim = null; this._stopRecording(); }\n    }, 90);\n  }\n\n  _stopRecording() {\n    if (this._timer) { clearInterval(this._timer); this._timer = null; }\n    if (this._sim) { clearInterval(this._sim); this._sim = null; }\n    if (this._rec) { try { this._rec.stop(); } catch (e) {} this._rec = null; }\n    const tx = this._tx();\n    this.setState({ recording: false, transcriptLen: tx ? tx.value.length : this.state.transcriptLen });\n  }\n\n  async extractAI() {\n    if (this.state.recording || this.state.extracting) return;\n    const tx = this._tx(); const transcript = tx ? tx.value.trim() : \"\";\n    this.setState({ extracting: true, extracted: false });\n    const started = Date.now();\n    let fields;\n    try { fields = await this._extract(transcript); }\n    catch (e) { fields = Object.assign({}, this.BRIEF_EXTRACTED); }\n    const wait = Math.max(0, 1100 - (Date.now() - started));\n    setTimeout(() => {\n      this.setState({ draft: Object.assign({}, this.state.draft, fields), extracting: false, extracted: true });\n    }, wait);\n  }\n\n  async _extract(transcript) {\n    if (transcript && window.claude && typeof window.claude.complete === \"function\") {\n      try {\n        const prompt = \"Tu es un assistant média. À partir de la retranscription suivante, renvoie UNIQUEMENT un objet JSON avec ces clés exactes (valeurs en français, chaînes courtes) : annonceur, objectif, cible, zone, periode, budget, message, contraintes, kpi.\\n\\nRetranscription :\\n\\\"\\\"\\\"\" + transcript + \"\\\"\\\"\\\"\";\n        const out = await window.claude.complete(prompt);\n        const m = out && out.match(/\\{[\\s\\S]*\\}/);\n        if (m) {\n          const j = JSON.parse(m[0]); const res = {};\n          this.BRIEF_FIELDS.forEach(f => { res[f.key] = (j[f.key] != null ? String(j[f.key]) : (this.BRIEF_EXTRACTED[f.key] || \"\")); });\n          return res;\n        }\n      } catch (e) { /* repli local */ }\n    }\n    return Object.assign({}, this.BRIEF_EXTRACTED);\n  }\n\n  saveBrief() {\n    const next = Object.assign({}, this.state.draft);\n    this.BRIEF_FIELDS.forEach(f => { const el = document.getElementById(\"om-bf-\" + f.key); if (el) next[f.key] = el.value; });\n    this._stopAll();\n    this.setState({ brief: next, draft: next, modal: false, recording: false });\n  }\n\n  renderVals() {\n    const scKey = this.state.scenario === \"B\" ? \"B\" : \"A\";\n    const sc = this.RECO_SCENARIOS[scKey];\n    const budget = sc.budget;\n\n    const meta = {\n      title: this.META.title, annonceur: this.META.annonceur, zone: this.META.zone, periode: this.META.periode,\n      budgetTxt: this.fmt(budget) + \" €\"\n    };\n\n    const cible = this.CIBLE;\n    const maxIndice = 175;\n    const traits = this.TRAITS.map(t => {\n      const b = this.affBand(t.indice);\n      return { label: t.label, indice: t.indice, color: b.color, barPct: Math.round(t.indice / maxIndice * 100) };\n    });\n\n    const popTotal = this.BASSINS.reduce((a, b) => a + b.pop, 0);\n    const cibleTotal = this.BASSINS.reduce((a, b) => a + b.cible, 0);\n    const maxCible = Math.max(...this.BASSINS.map(b => b.cible));\n    const territoire = {\n      count: this.BASSINS.length,\n      popTotalTxt: this.fmt(popTotal * 1000),\n      cibleTotalTxt: this.fmt(cibleTotal * 1000),\n      tauxTxt: Math.round(cibleTotal / popTotal * 100) + \" %\"\n    };\n    const bassins = this.BASSINS.slice().sort((a, b) => b.cible - a.cible).map((b, i, arr) => ({\n      name: b.name, short: b.short,\n      popTxt: this.fmt(b.pop * 1000), cibleTxt: this.fmt(b.cible * 1000),\n      pctTxt: Math.round(b.cible / cibleTotal * 100) + \" %\",\n      barPct: Math.round(b.cible / maxCible * 100),\n      border: i === arr.length - 1 ? \"none\" : \"1px solid #E4E7FF\"\n    }));\n\n    // ── projection géographique (équirectangulaire) du Grand Est ──\n    const border = this.GE_BORDER;\n    const lons = border.map(p => p[0]), lats = border.map(p => p[1]);\n    const lonMin = Math.min(...lons), lonMax = Math.max(...lons);\n    const latMin = Math.min(...lats), latMax = Math.max(...lats);\n    const kx = Math.cos((latMin + latMax) / 2 * Math.PI / 180);\n    const mapW = 460, pad = 24, topPad = 18, botPad = 32, drawW = mapW - 2 * pad;\n    const geoW = (lonMax - lonMin) * kx, geoH = latMax - latMin;\n    const scale = drawW / geoW;\n    const mapVbH = Math.round(topPad + geoH * scale + botPad);\n    const projX = lon => pad + (lon - lonMin) * kx * scale;\n    const projY = lat => topPad + (latMax - lat) * scale;\n    const map = {\n      path: \"M\" + border.map(p => projX(p[0]).toFixed(1) + \",\" + projY(p[1]).toFixed(1)).join(\" L\") + \" Z\",\n      viewBox: \"0 0 \" + mapW + \" \" + mapVbH\n    };\n    const cLat = (latMin + latMax) / 2;\n    const bubbles = this.BASSINS.map(b => {\n      const cx = projX(b.lon), cy = projY(b.lat);\n      const r = 11 + Math.sqrt(b.cible / maxCible) * 26;\n      const above = b.lat >= cLat;              // étiquette vers l'extérieur de la région\n      const labelY = above ? cy - r - 14 : cy + r + 14;\n      const valY = above ? cy - r - 2 : cy + r + 26;\n      return { short: b.short, cibleTxt: this.fmt(b.cible * 1000),\n        cx: Math.round(cx), cy: Math.round(cy), r: Math.round(r),\n        leftPct: +(cx / mapW * 100).toFixed(2),\n        namePct: +(labelY / mapVbH * 100).toFixed(2),\n        valPct: +(valY / mapVbH * 100).toFixed(2) };\n    });\n\n    // ── socio-démographique ──\n    const ageMax = Math.max(...this.SOCIO.age.map(a => a.pct));\n    const socioAge = this.SOCIO.age.map(a => ({\n      label: a.label, pctTxt: a.pct + \" %\", barPct: Math.round(a.pct / ageMax * 100),\n      peak: a.pct === ageMax\n    }));\n    const cspMax = Math.max(...this.SOCIO.csp.map(c => c.pct));\n    const socioCsp = this.SOCIO.csp.map((c, i) => ({\n      label: c.label, pctTxt: c.pct + \" %\", barPct: Math.round(c.pct / cspMax * 100),\n      color: i === 0 ? \"#2D4BF0\" : \"#7E93E8\"\n    }));\n    const sexe = {\n      femmesPct: this.SOCIO.sexe.femmes, hommesPct: this.SOCIO.sexe.hommes,\n      femmesTxt: this.SOCIO.sexe.femmes + \" %\", hommesTxt: this.SOCIO.sexe.hommes + \" %\"\n    };\n\n    // ── répartition territoriale de la sous-cible choisie (même fond de carte) ──\n    const segKey = this.SEG_TARGETS[this.state.segTarget] ? this.state.segTarget : \"ensemble\";\n    const seg = this.SEG_TARGETS[segKey];\n    const segMaxC = Math.max(...seg.counts);\n    const segTotal = seg.counts.reduce((a, c) => a + c, 0);\n    const segBubbles = this.BASSINS.map((b, i) => {\n      const cx = projX(b.lon), cy = projY(b.lat);\n      const count = seg.counts[i];\n      const r = 11 + Math.sqrt(count / segMaxC) * 26;\n      const above = b.lat >= cLat;\n      const labelY = above ? cy - r - 14 : cy + r + 14;\n      const valY = above ? cy - r - 2 : cy + r + 26;\n      return { short: b.short, cibleTxt: this.fmt(count * 1000),\n        cx: Math.round(cx), cy: Math.round(cy), r: Math.round(r),\n        barPct: Math.round(count / segMaxC * 100),\n        leftPct: +(cx / mapW * 100).toFixed(2),\n        namePct: +(labelY / mapVbH * 100).toFixed(2),\n        valPct: +(valY / mapVbH * 100).toFixed(2) };\n    });\n    const segMeta = {\n      label: seg.label, totalTxt: this.fmt(segTotal * 1000),\n      isEnsemble: segKey === \"ensemble\", notEnsemble: segKey !== \"ensemble\",\n      isJeunes: segKey === \"jeunes\", notJeunes: segKey !== \"jeunes\",\n      isEtablis: segKey === \"etablis\", notEtablis: segKey !== \"etablis\",\n      isCspsup: segKey === \"cspsup\", notCspsup: segKey !== \"cspsup\",\n      onEnsemble: () => this.setState({ segTarget: \"ensemble\" }),\n      onJeunes: () => this.setState({ segTarget: \"jeunes\" }),\n      onEtablis: () => this.setState({ segTarget: \"etablis\" }),\n      onCspsup: () => this.setState({ segTarget: \"cspsup\" })\n    };\n\n    // ── étude de marché du secteur (Kantar) ──\n    const mixArcs = this.mkDonut(this.SECTOR.mix.map(m => ({ value: m.pct, color: m.color })), 100, 100, 78);\n    const mixTop = this.SECTOR.mix.slice().sort((a, b) => b.pct - a.pct)[0];\n    const mixLegend = this.SECTOR.mix.map(m => ({ label: m.label, color: m.color, pctTxt: m.pct + \" %\" }));\n    const saMax = Math.max(...this.SECTOR.saison.map(s => s.idx));\n    const saison = this.SECTOR.saison.map(s => ({\n      m: s.m, heightPct: Math.round(s.idx / saMax * 100),\n      color: s.idx >= 150 ? \"#2D4BF0\" : (s.idx >= 110 ? \"#6E86E8\" : \"#B8C6F2\")\n    }));\n    const t10Max = Math.max(...this.SECTOR.top10.map(t => t.invest));\n    const top10 = this.SECTOR.top10.map((t, i, arr) => ({\n      rang: i + 1, name: t.name,\n      investTxt: t.invest.toFixed(1).replace(\".\", \",\") + \" M€\",\n      sovTxt: (t.invest / this.SECTOR.total * 100).toFixed(1).replace(\".\", \",\") + \" %\",\n      barPct: Math.round(t.invest / t10Max * 100),\n      rankColor: i === 0 ? \"#2D4BF0\" : (i < 3 ? \"#EEF0FF\" : \"#F1F3F9\"),\n      rankInk: i === 0 ? \"#FFFFFF\" : (i < 3 ? \"#2D4BF0\" : \"#7B8BB2\"),\n      border: i === arr.length - 1 ? \"none\" : \"1px solid #E4E7FF\"\n    }));\n    const sector = {\n      name: this.SECTOR.name,\n      totalTxt: this.SECTOR.total.toFixed(0) + \" M€\",\n      mixArcs, mixLegend,\n      mixTopPctTxt: mixTop.pct + \" %\", mixTopLabel: mixTop.label,\n      saison, top10\n    };\n\n    const medias = this.MEDIAS.map((m, i, arr) => {\n      const b = this.affBand(m.indice);\n      return { media: m.media, short: m.short,\n        couvTxt: m.couv + \" %\",\n        tempsTxt: m.temps == null ? \"—\" : m.temps + \" min\",\n        indice: m.indice, color: b.color, bg: b.bg,\n        affBar: Math.round(m.indice / maxIndice * 100),\n        border: i === arr.length - 1 ? \"none\" : \"1px solid #E4E7FF\" };\n    });\n\n    // ── quadrant ──\n    const W = 520, H = 360, padL = 52, padR = 26, padT = 26, padB = 46;\n    const right = W - padR, bottom = H - padB;\n    const xMin = 30, xMax = 95, yMin = 80, yMax = 150;\n    const xFor = c => padL + (c - xMin) / (xMax - xMin) * (right - padL);\n    const yFor = v => bottom - (v - yMin) / (yMax - yMin) * (bottom - padT);\n    const divX = xFor(70), divY = yFor(110);\n    const pX = v => +(v / W * 100).toFixed(2);\n    const pY = v => +(v / H * 100).toFixed(2);\n    const gridY = [80, 100, 120, 140].map(v => ({ y: Math.round(yFor(v)), label: String(v),\n      tickLeftPct: pX(padL - 5), topPct: pY(yFor(v)) }));\n    const gridX = [40, 60, 80].map(c => ({ x: Math.round(xFor(c)), label: c + \" %\",\n      leftPct: pX(xFor(c)), tickTopPct: pY(H - padB + 7) }));\n    const quadPts = this.MEDIAS.map(m => {\n      const cx = xFor(m.couv), cy = yFor(m.indice);\n      const r = 9 + (m.couv / 100) * 16;\n      return { label: m.short, color: this.quadColor(m.indice),\n        cx: Math.round(cx), cy: Math.round(cy), r: Math.round(r),\n        leftPct: pX(cx), labelTopPct: pY(cy - r - 8) };\n    });\n    const quad = {\n      pts: quadPts, gridY, gridX,\n      padL, padT, right, bottom,\n      divX: Math.round(divX), divY: Math.round(divY),\n      qW: Math.round(right - divX), qH: Math.round(divY - padT),\n      prioLeftPct: pX(right), prioTopPct: pY(padT - 4),\n      yTitleLeftPct: pX(padL - 5), yTitleTopPct: pY(padT - 16),\n      axisXTopPct: pY(H - 4)\n    };\n\n    const regieColor = {\n      \"DOOH\": \"#E60023\", \"Search\": \"#34A853\", \"Social (Meta)\": \"#0668E1\",\n      \"Vidéo / YouTube\": \"#EA4335\", \"Radio\": \"#C8A200\", \"AVOD / CTV\": \"#7C3AED\", \"Audio digital\": \"#1DB954\"\n    };\n    const regies = this.REGIES.map((r, i, arr) => {\n      const b = this.affBand(r.affinite);\n      return { levier: r.levier, regie: r.regie,\n        audienceTxt: this.fmt(r.audience * 1000),\n        couvTxt: r.couv + \" %\", affinite: r.affinite,\n        affColor: b.color, affBg: b.bg, color: regieColor[r.levier] || \"#2D4BF0\",\n        border: i === arr.length - 1 ? \"none\" : \"1px solid #E4E7FF\" };\n    });\n\n    const maxPct = Math.max(...sc.items.map(r => r.pct));\n    const recoItems = sc.items.map((r, i, arr) => {\n      const ob = this.OBJ[this.OBJ_OF[r.levier]] || this.OBJ.branding;\n      return {\n        levier: r.levier, color: r.color, just: r.just,\n        pctTxt: r.pct + \" %\",\n        eurosTxt: this.fmt(budget * r.pct / 100) + \" €\",\n        barPct: Math.round(r.pct / maxPct * 100),\n        objLabel: ob.label, objColor: ob.color, objBg: ob.bg,\n        border: i === arr.length - 1 ? \"none\" : \"1px solid #E4E7FF\"\n      };\n    });\n\n    // ── répartition du budget par objectif ──\n    const objAgg = this.OBJ_ORDER.map(key => {\n      const o = this.OBJ[key];\n      const pct = sc.items.filter(r => this.OBJ_OF[r.levier] === key).reduce((a, r) => a + r.pct, 0);\n      return { key, label: o.label, donut: o.donut, color: o.color, bg: o.bg, pct };\n    }).filter(o => o.pct > 0);\n    const objMax = Math.max(...objAgg.map(o => o.pct));\n    const objSplit = objAgg.map(o => ({\n      label: o.label, donut: o.donut, color: o.color, bg: o.bg,\n      pctTxt: o.pct + \" %\",\n      eurosTxt: this.fmt(budget * o.pct / 100) + \" €\",\n      barPct: Math.round(o.pct / objMax * 100)\n    }));\n    const topObj = objAgg.slice().sort((a, b) => b.pct - a.pct)[0];\n    const reco = {\n      items: recoItems,\n      objSplit,\n      objArcs: this.mkDonut(objAgg.map(o => ({ value: o.pct, color: o.donut })), 100, 100, 78),\n      objTopLabel: topObj ? topObj.label : \"\",\n      objTopPctTxt: topObj ? topObj.pct + \" %\" : \"\",\n      pillALabel: this.RECO_SCENARIOS.A.name, pillBLabel: this.RECO_SCENARIOS.B.name,\n      aActive: scKey === \"A\", aInactive: scKey !== \"A\",\n      bActive: scKey === \"B\", bInactive: scKey !== \"B\",\n      onPillA: () => this.setState({ scenario: \"A\" }),\n      onPillB: () => this.setState({ scenario: \"B\" }),\n      scenarioName: sc.name, scenarioTag: sc.tag,\n      budgetTxt: this.fmt(budget) + \" €\",\n      leviersTxt: sc.items.length + \" leviers\"\n    };\n\n    // ── Brief (carte + modale) ──\n    const bf = this.state.brief;\n    const dr = this.state.draft || bf;\n    const brief = {\n      annonceur: bf.annonceur, budget: bf.budget, objectif: bf.objectif,\n      cible: bf.cible, zone: bf.zone, periode: bf.periode,\n      message: bf.message, contraintes: bf.contraintes, kpi: bf.kpi,\n      onEdit: () => this.openBrief()\n    };\n    const elapsed = this.state.elapsed || 0;\n    const timerTxt = String(Math.floor(elapsed / 60)).padStart(2, \"0\") + \":\" + String(elapsed % 60).padStart(2, \"0\");\n    const statusTxt = this.state.recording ? \"Écoute en cours… parlez naturellement\"\n      : (this.state.transcriptLen > 0 ? \"Retranscription prête — lancez l'extraction\" : \"Appuyez sur le micro pour dicter le brief\");\n    const waves = Array.from({ length: 34 }, (_, i) => ({\n      h: 5 + Math.round(20 * Math.abs(Math.sin(i * 0.7 + 1))) + (i % 3) * 3,\n      delay: ((i % 9) * 0.07).toFixed(2)\n    }));\n    const fields = this.BRIEF_FIELDS.map(f => ({\n      key: f.key, label: f.label, value: dr[f.key] || \"\", domId: \"om-bf-\" + f.key,\n      multiline: f.multiline, single: !f.multiline, span: f.span, ph: f.ph\n    }));\n    const canExtract = this.state.transcriptLen > 0 && !this.state.recording;\n    const modal = {\n      open: this.state.modal, fields, waves,\n      recording: this.state.recording, idle: !this.state.recording,\n      extracting: this.state.extracting, notExtracting: !this.state.extracting,\n      extracted: this.state.extracted && !this.state.recording,\n      canExtract, cantExtract: !canExtract,\n      timerTxt, statusTxt,\n      onClose: () => this.closeBrief(), onRecord: () => this.toggleRecord(),\n      onExtract: () => this.extractAI(), onSave: () => this.saveBrief(),\n      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); }\n    };\n\n    return { meta, cible, traits, territoire, bassins, bubbles, map, socioAge, socioCsp, sexe, segBubbles, segMeta, sector, medias, quad, regies, reco, brief, modal };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
